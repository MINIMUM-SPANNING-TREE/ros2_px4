# Navigation 配置文件

# 雷达话题
pointcloud_topic: '/lslidar_point_cloud'

# 障碍物检测参数
obstacle_detection:
  min_height: 0.2
  max_height: 3.0
  min_distance: 0.5
  max_distance: 10.0
  cluster_tolerance: 0.5
  min_cluster_size: 5

# 避障参数
avoidance:
  safety_distance: 2.0
  warning_distance: 3.0
  max_speed: 2.0
  max_yaw_rate: 0.5

# 导航参数
navigation:
  planning_rate: 10.0
  visualization_rate: 5.0
  default_timeout: 60.0
